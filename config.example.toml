# Provider config — bring your own keys; the free OSM path needs nothing.

[discovery]
# default = osm (free, no key). alternative: google_places
provider = "osm"
country = "US"

# optional: set GOOGLE_PLACES_API_KEY in your environment to use google_places

[qualify]
workers = 12
timeout_seconds = 12

[hygiene]
log_file = "./bank/hygiene_log.jsonl"
