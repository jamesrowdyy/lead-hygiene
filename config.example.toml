# Provider config — bring your own keys, nothing is required for the free path.

[discovery]
# default = osm (free, no key). alternatives: google_places | treg | getleadsio
provider = "osm"
country = "US"

# --- optional paid providers (leave blank to stay free) ---
# GOOGLE_PLACES_API_KEY =
# TREG_API_KEY =
# GETLEADSIO_KEY =

[qualify]
workers = 12
timeout_seconds = 12

[hygiene]
bank_dir = "./bank"
log_file = "./bank/hygiene_log.jsonl"
